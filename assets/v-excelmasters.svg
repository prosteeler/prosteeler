    <radialGradient id="vexcelmasterssvg-orb" cx=".85" cy="0" r=".9">
      <stop offset="0" stop-color="#00ED64" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00ED64" stop-opacity="0"/>
    </radialGradient>
    <pattern id="vexcelmasterssvg-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
