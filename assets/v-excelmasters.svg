<svg xmlns="http://www.w3.org/2000/svg" width="590" height="270" viewBox="0 0 590 270" role="img" aria-label="Excel Masters — Deterministic AI spreadsheet learning platform">
  <title>Excel Masters — Deterministic AI spreadsheet learning platform</title>
  <defs>
    <linearGradient id="vexcelmasterssvg-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ED64" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#1a2033" stop-opacity=".6"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="vexcelmasterssvg-glass" x1="0" y1="0" x2="0" y2="1">
