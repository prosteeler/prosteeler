  <line x1="30" y1="128" x2="560" y2="128" stroke="#1a2033"/>
  <text x="30" y="152" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e6e9f5" fill-opacity=".86"><tspan fill="#00ED64">▸ </tspan>Owns platform architecture, infrastructure &amp; delivery</text><text x="30" y="177" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e6e9f5" fill-opacity=".86"><tspan fill="#00ED64">▸ </tspan>Interactive formula arenas &amp; student tools</text><text x="30" y="202" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e6e9f5" fill-opacity=".86"><tspan fill="#00ED64">▸ </tspan>Edge-deployed on Vercel with streaming SSR</text>
