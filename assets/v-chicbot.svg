    </g><g transform="translate(202.78,224)">
      <rect width="85.1" height="22" rx="11" fill="#5eead4" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".45"/>
      <text x="42.55" y="15" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="11" fill="#5eead4">websockets</text>
    </g>
